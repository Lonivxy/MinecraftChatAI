main: ${PACKAGE}.${NAME}
name: ${NAME}
version: "${VERSION}"
api-version: "26.1.2"
author: Lonivxy
description: AI chat (neko assistant) and chat translation for Paper servers.
permissions:
  minecraftchatai.aichat:
    description: Allows use of the /aichat command
    default: true
  minecraftchatai.translate:
    description: Allows use of the /translate command
    default: true
  aichat.publicsessionreset:
    description: Allows use of /aichat resetsession public to reset the public conversation
    default: false
  minecraftchatai.reload:
    description: Allows use of /aichat reload to reload config.yml
    default: false
  minecraftchatai.*:
    description: Grants all MinecraftChatAI permissions
    default: false
    children:
      minecraftchatai.aichat: true
      minecraftchatai.translate: true
      aichat.publicsessionreset: true
      minecraftchatai.reload: true