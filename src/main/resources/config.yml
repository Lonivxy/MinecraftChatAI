# AI provider settings for MinecraftChatAI.
# All requests are sent to <base-url>/chat/completions using the OpenAI-compatible
# chat completions API, so any provider that supports it works (DeepSeek, OpenAI, etc.).
ai:
  # Base URL of the provider API. For DeepSeek leave this as-is.
  base-url: "https://api.deepseek.com"

  # Your provider API key. Replace "REPLACE_ME" with a real key or the commands will refuse to run.
  api-key: "REPLACE_ME"

  # The model to use. For DeepSeek: deepseek-v4-flash or deepseek-v4-pro.Example docs here:https://api-docs.deepseek.com/ ,you also can find your own provider's docs.
  model: "deepseek-v4-flash"

  # Maximum number of characters for /aichat replies (including spaces and symbols).Recommend not too high, as the AI may generate long replies that can be spammy. The default is 300 characters.
  max-reply-length: 300

  # Timeout in seconds for AI requests.
  timeout-seconds: 30
